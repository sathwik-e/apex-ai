<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI - Race Strategy Predictor</title>
    
    <!-- Importing Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importing Chart.js for rendering the interactive graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Tailwind configuration for our specific F1 red color -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        racingRed: '#E10600',
                        darkBg: '#111111',
                        panelBg: '#1F1F1F'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen">

    <!-- Navigation / Header -->
    <nav class="bg-panelBg border-b border-gray-800 p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-racingRed rounded-full flex items-center justify-center font-bold text-white">
                    A
                </div>
                <span class="text-xl font-bold tracking-wider text-white">APEX <span class="text-racingRed">AI</span></span>
            </div>
            <div class="text-sm text-gray-400">
                Live Telemetry & Degradation Predictor
            </div>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Sidebar: Controls -->
        <div class="bg-panelBg rounded-xl p-6 border border-gray-800 shadow-md h-fit">
            <h2 class="text-lg font-semibold text-white mb-4 uppercase tracking-wide border-b border-gray-700 pb-2">Session Setup</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Grand Prix</label>
                    <select class="w-full bg-darkBg border border-gray-700 rounded p-2 text-white outline-none focus:border-racingRed">
                        <option>Monza (Italy)</option>
                        <option>Silverstone (UK)</option>
                        <option>Suzuka (Japan)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Driver</label>
                    <select class="w-full bg-darkBg border border-gray-700 rounded p-2 text-white outline-none focus:border-racingRed">
                        <option>Max Verstappen (VER)</option>
                        <option>Lando Norris (NOR)</option>
                        <option>Charles Leclerc (LEC)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Target Compound</label>
                    <div class="flex space-x-2">
                        <button class="flex-1 bg-red-600 text-white rounded py-2 text-sm font-bold opacity-50 hover:opacity-100 transition">SOFT</button>
                        <button class="flex-1 bg-yellow-500 text-black rounded py-2 text-sm font-bold opacity-100 border-2 border-white">MEDIUM</button>
                        <button class="flex-1 bg-white text-black rounded py-2 text-sm font-bold opacity-50 hover:opacity-100 transition">HARD</button>
                    </div>
                </div>

                <button class="w-full bg-racingRed hover:bg-red-700 text-white font-bold py-3 rounded mt-4 transition shadow-[0_0_15px_rgba(225,6,0,0.4)]">
                    RUN PREDICTION
                </button>
            </div>
        </div>

        <!-- Right Side: Charts & Stats -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Key Metrics Row -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-panelBg rounded-xl p-4 border border-gray-800 text-center">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Predicted Drop-off</div>
                    <div class="text-2xl font-bold text-racingRed">+1.2s / 10 Laps</div>
                </div>
                <div class="bg-panelBg rounded-xl p-4 border border-gray-800 text-center">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Optimal Pit Lap</div>
                    <div class="text-2xl font-bold text-white">Lap 24</div>
                </div>
                <div class="bg-panelBg rounded-xl p-4 border border-gray-800 text-center">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Model Confidence</div>
                    <div class="text-2xl font-bold text-green-400">92.4%</div>
                </div>
            </div>

            <!-- Chart Container -->
            <div class="bg-panelBg rounded-xl p-6 border border-gray-800 shadow-md">
                <h2 class="text-lg font-semibold text-white mb-4 uppercase tracking-wide">Tire Degradation Curve (Medium Compound)</h2>
                <div class="relative h-80 w-full">
                    <canvas id="predictionChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Chart.js Logic -->
    <script>
        // We mock the data here to represent what the Python AI model outputted
        const laps = Array.from({length: 30}, (_, i) => i + 1);
        
        // Simulating the actual lap times (bumpy, fluctuating data)
        const actualLapTimes = laps.map(lap => {
            // Base time 85 seconds + slight increase over time + random noise
            return 85.0 + (lap * 0.05) + (Math.random() * 0.8 - 0.4); 
        });

        // Simulating the ML predicted trend (smooth curve)
        const predictedLapTimes = laps.map(lap => {
            return 85.0 + (lap * 0.05);
        });

        const ctx = document.getElementById('predictionChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: laps,
                datasets: [
                    {
                        label: 'Actual Lap Times (VER)',
                        data: actualLapTimes,
                        borderColor: 'rgba(56, 189, 248, 0.8)', // Light blue
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        borderWidth: 1,
                        pointRadius: 3,
                        pointBackgroundColor: 'rgba(56, 189, 248, 1)',
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: 'Apex AI Prediction Trend',
                        data: predictedLapTimes,
                        borderColor: '#E10600', // Racing Red
                        borderWidth: 3,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#9CA3AF' } // Tailwind gray-400
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Tyre Age (Laps)', color: '#9CA3AF' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#9CA3AF' }
                    },
                    y: {
                        title: { display: true, text: 'Lap Time (Seconds)', color: '#9CA3AF' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#9CA3AF' }
                    }
                }
            }
        });
    </script>
</body>
</html>
